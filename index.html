<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida a la empresa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tarjeta-bienvenida">
        <header>
            <img id="logo" src="" alt="Logo de la empresa">
        </header>
        
        <main>
            <h1>¡Bienvenido, <span id="nombre-empleado"></span>!</h1>
            <p id="mensaje-bienvenida"></p>
        </main>

        <footer>
            <div class="seccion-firma">
                <p>Atentamente,</p>
                <img id="firma" src="" alt="Firma del remitente">
                <p id="nombre-remitente" class="remitente-texto"></p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
